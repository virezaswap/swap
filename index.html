<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Vireza Swap</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #0b1020;
      color: #eef4ff;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 460px; margin: 32px auto; }
    h1 { margin-bottom: 6px; }
    p { color: #a3b3cd; line-height: 1.6; }
    .card {
      background: #172137;
      padding: 22px;
      border: 1px solid #ffffff18;
      border-radius: 22px;
    }
    label { display: block; margin: 20px 0 8px; }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font: inherit;
    }
    input {
      color: white;
      background: #0b1426;
      border: 1px solid #ffffff30;
    }
    button {
      margin-top: 14px;
      background: #8bdcff;
      border: 0;
      color: #081321;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #wallet { margin-bottom: 20px; }
    #quote { white-space: pre-line; line-height: 1.8; }
    #status { overflow-wrap: anywhere; }
    small { color: #a3b3cd; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vireza Swap</h1>
    <p>GRAM → USDT · TON mainnet</p>

    <section class="card">
      <div id="wallet"></div>

      <label for="amount">GRAM amount</label>
      <input
        id="amount"
        inputmode="decimal"
        autocomplete="off"
        placeholder="Example: 0.5"
      >

      <p><small>Slippage tolerance: 0.5%</small></p>

      <button id="estimate" type="button">Get quote</button>
      <p id="quote" aria-live="polite"></p>

      <button id="swap" type="button" disabled>
        Swap
      </button>

      <p id="status" role="status">
        Connect your wallet, then get a quote.
      </p>

      <button id="check" type="button" hidden>
        Check transaction
      </button>
      <pre id="records"></pre>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>qq
